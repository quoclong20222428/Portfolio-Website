<!DOCTYPE html>
<html>
<head>
    <title>Test Projects</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin: 10px 0; background: #f9f9f9; }
        .tag { background: #ffd900; padding: 10px; margin-bottom: 10px; }
        .desc { margin: 10px 0; }
        .btn { display: inline-block; padding: 8px 15px; background: #333; color: white; text-decoration: none; margin-top: 10px; }
        span.tech { display: inline-block; padding: 3px 8px; background: #011aff; color: white; border-radius: 3px; font-size: 0.9rem; margin: 2px; }
    </style>
</head>
<body>
    <h1>Test Projects Display</h1>
    
    <section class="work" id="work">
        <h2>Projects <span>Made</span></h2>
        <div class="box-container"></div>
    </section>

    <script>
        // Copy of the functions from script.js
        const GITHUB_USERNAME = 'quoclong20222428';
        const GITHUB_API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`;

        const techNameMap = {
            'react': 'React',
            'vue': 'Vue',
            'angular': 'Angular',
            'nodejs': 'Node.js',
            'node.js': 'Node.js',
            'expressjs': 'Express.js',
            'express': 'Express',
            'fastapi': 'FastAPI',
            'python': 'Python',
            'javascript': 'JavaScript',
            'typescript': 'TypeScript',
            'java': 'Java',
            'spring-boot': 'Spring Boot',
            'spring': 'Spring',
            'postgresql': 'PostgreSQL',
            'mongodb': 'MongoDB',
            'mysql': 'MySQL',
            'docker': 'Docker',
            'kubernetes': 'Kubernetes',
            'tailwindcss': 'Tailwind CSS',
            'bootstrap': 'Bootstrap',
            'sass': 'Sass',
            'webpack': 'Webpack',
            'vite': 'Vite',
            'git': 'Git',
            'aws': 'AWS',
            'gcp': 'GCP',
            'azure': 'Azure',
            'graphql': 'GraphQL',
            'rest-api': 'REST API',
            'html': 'HTML',
            'css': 'CSS'
        };

        function formatTechName(topic) {
            if (!topic) return '';
            const lowerTopic = topic.toLowerCase();
            if (techNameMap[lowerTopic]) {
                return techNameMap[lowerTopic];
            }
            return topic
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function getDefaultProjects() {
            return [
                {
                    name: 'Weather Forecast',
                    description: 'A full-stack web real-time weather with location search and weather forecast data.',
                    html_url: 'https://github.com/quoclong20222428/weather-forecast-fe',
                    topics: ['react', 'typescript', 'nodejs', 'mongodb']
                },
                {
                    name: 'Sudoku Solver',
                    description: 'Full-stack Sudoku game with user authentication, game saving, intelligent hints.',
                    html_url: 'https://github.com/quoclong20222428/sudoku-game',
                    topics: ['react', 'expressjs', 'mongodb', 'javascript']
                },
                {
                    name: 'FlowLite',
                    description: 'Full-featured task management platform for group members or individuals.',
                    html_url: 'https://github.com/tquocan04/mini-management-project',
                    topics: ['react', 'nodejs', 'tailwindcss']
                }
            ];
        }

        async function fetchGitHubProjects() {
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const repos = await response.json();
                const filteredRepos = repos.filter(repo => 
                    repo.private === false && 
                    repo.fork === false &&
                    repo.name !== 'quoclong20222428'
                );
                console.log('GitHub repos loaded:', filteredRepos.length);
                return filteredRepos.length > 0 ? filteredRepos : getDefaultProjects();
            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
                console.log('Using default projects as fallback');
                return getDefaultProjects();
            }
        }

        function showProjects(projects) {
            let projectsContainer = document.querySelector("#work .box-container");
            console.log('Container found:', projectsContainer !== null);
            
            if (!projectsContainer) {
                console.error('Container not found!');
                return;
            }
            
            let projectHTML = "";
            projects.slice(0, 6).forEach((project) => {
                const techBadges = project.topics && project.topics.length > 0
                    ? project.topics.map(t => `<span class="tech">${formatTechName(t)}</span>`).join('')
                    : '';
                
                projectHTML += `
                    <div class="box">
                      <div class="tag">
                        <h3>${project.name}</h3>
                      </div>
                      <div class="desc">
                        <p>${project.description || 'No description available.'}</p>
                        <div>${techBadges}</div>
                        <a href="${project.html_url}" class="btn" target="_blank">View Repository</a>
                      </div>
                    </div>`;
            });
            projectsContainer.innerHTML = projectHTML;
            console.log('Projects displayed:', projects.length);
        }

        // Load projects on page load
        window.addEventListener('DOMContentLoaded', async function() {
            console.log('DOM loaded, fetching projects...');
            const repos = await fetchGitHubProjects();
            showProjects(repos);
        });
    </script>
</body>
</html>
